info:
  app:
    name: sourcerer
grails:
  codegen:
    defaultPackage: sourcerer
  mime:
    disable:
      accept:
        header:
          userAgents: []
spring:
  main:
    banner-mode: 'off'
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  compression:
    enabled: false
  tomcat:
    accept-count: 2048
    max-connections: 20000
    mbeanregistry:
      enabled: false
logging:
  level:
    root: WARN
    sourcerer: INFO
sourcerer:
  data-dir: ./data
  # jdbc-url: jdbc:postgresql://localhost/sourcerer   (defaults to embedded H2 under data-dir)
  # token-secret: at-least-32-bytes...                (defaults to a generated, persisted secret)
  db-pool-size: 32
